model:
  # Path to second affordance checkpoint (.pth/.pt)
  model_path: "${paths.repo_root}/train_eval_second/checkpoints_sapien/best_model.pth"
  device: cuda:0  # enforce GPU, do not fall back to CPU
  max_points: null

sampling:
  strategy: topk  # topk | softmax
  top_k: 128
  nms_radius: 0.01
  temperature: 0.1
  num_samples: 1  # Number of second-hand candidates per first-hand point (the "2" in 1×2×3)

visualization:
  enable: true
  max_vis_points: 20000


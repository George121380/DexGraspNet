envs:
  affordance_env: pn
  pose_gen_env: DexGrasp
  optimizer_env: bimangrasp

paths:
  repo_root: /media/george/Projects/Research/2026-CVPR-BiDexHand/affordance-bidex
  input_root: ${paths.repo_root}/pipeline/pipeline_input
  outputs_root: ${paths.repo_root}/pipeline/outputs
  third_party:
    dexgrasp: ${paths.repo_root}/third_party/DexGraspNet2
    bimangrasp: ${paths.repo_root}/third_party/BimanGrasp-Generation/BimanGrasp-Optimization

runtime:
  device: cuda:0
  seed: 42
  num_workers: 0
  save_intermediates: true

server:
  mode: cli  # cli | panel
  host: 127.0.0.1
  port: 7890

visualization:
  enable: true
  point_size: 2.0
  cmap: viridis

multipose:
  # Centralized control of the 1×2×3 pose multiplicity
  kp1_samples: 1              # number of first-hand keypoints ("1")
  kp2_samples_per_kp1: 2      # number of second-hand keypoints per first-hand ("2")
  twist_count_per_pair: 1     # number of random twists per (kp1,kp2) pair ("3")
  # Sampling mode: if true, sample kp1/kp2 by value (softmax over scores);
  # if false, use top-k style (deterministic top-n for kp2 and dedup for kp1)
  sample_by_value: false
  temperature_kp1: 0.1        # softmax temperature for kp1 value sampling
  temperature_kp2: 0.1        # softmax temperature for kp2 value sampling





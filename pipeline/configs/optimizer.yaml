optimizer:
  steps: 300
  gpu: "0"
  step_size: 0.002
  accept_warmup: 15
  freeze_joints_steps: 15
  freeze_translation_steps: 10   # 早期固定手腕平移，防止整体漂移
  noise_factor: 0.05             # 早期降低Langevin噪声（默认0.1）

energy:
  # 接触距离项：接触点到物体表面的距离（越近越好）
  w_dis: 100.0
  # 穿透项：手-物体的相互穿透深度（越小越好）
  w_pen: 125.0
  # 自穿透项：手内部及双手之间的穿透（越小越好）
  w_spen: 10.0
  # 关节限位项：越界的关节角度罚（越小越好）
  w_joints: 1.0
  # Wrench体积/封闭性：抓取矩阵体积相关（越大越好，能量为其反比）
  w_vew: 0.5

paths:
  # BimanGrasp-Optimization root
  biman_root: "${paths.repo_root}/third_party/BimanGrasp-Generation/BimanGrasp-Optimization"
  # Use pipeline input meshes for optimization to match the pc input
  data_root: "${paths.repo_root}/pipeline/pipeline_input"
  experiments_base: "${paths.repo_root}/third_party/BimanGrasp-Generation/data/experiments"
  right_hand_mjcf: "${paths.repo_root}/third_party/BimanGrasp-Generation/BimanGrasp-Optimization/mjcf/right_shadow_hand.xml"
  left_hand_mjcf: "${paths.repo_root}/third_party/BimanGrasp-Generation/BimanGrasp-Optimization/mjcf/left_shadow_hand.xml"
  mesh_path: "${paths.repo_root}/third_party/BimanGrasp-Generation/BimanGrasp-Optimization/mjcf/meshes"
  right_contact_points: "${paths.repo_root}/third_party/BimanGrasp-Generation/BimanGrasp-Optimization/mjcf/right_hand_contact_points.json"
  left_contact_points: "${paths.repo_root}/third_party/BimanGrasp-Generation/BimanGrasp-Optimization/mjcf/left_hand_contact_points.json"
  penetration_points: "${paths.repo_root}/third_party/BimanGrasp-Generation/BimanGrasp-Optimization/mjcf/penetration_points.json"

objects:
  # Map your input object name to BimanGrasp object code
  # e.g., kettle_100031: Cole_Hardware_Dishtowel_Multicolors
  object_code_map:
    "100015": "100015/processed_mesh"

io:
  # Output filenames
  optimized_npz_name: optimized_pose.npz
  optimized_json_name: optimized_pose.json

visualization:
  enable: false
  frame_stride: 10
  width: 900
  height: 900
  show_contacts: false
  background: "#E2F0D9"
  fps: 20
  video_name: optimization.mp4


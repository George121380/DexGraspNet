model:
  # Path to first affordance checkpoint (.pth/.pt)
  model_path: "${paths.repo_root}/train_eval_first/checkpoints_sapien/best_model.pth"
  device: cuda:0  # enforce GPU, do not fall back to CPU
  max_points: null  # e.g., 4096 for subsampling

sampling:
  strategy: topk  # topk | softmax
  top_k: 128
  nms_radius: 0.01  # meters
  temperature: 0.1

visualization:
  enable: true
  max_vis_points: 20000

